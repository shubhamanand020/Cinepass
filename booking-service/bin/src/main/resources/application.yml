server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        connection:
          # keep the pessimistic-lock wait bounded so a stuck request can't
          # block the whole seat-allocation path indefinitely
          lock_timeout: 3000
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# how long a "held" seat stays reserved before the hold expires automatically
booking:
  hold-duration-seconds: 300
  hold-expiry-sweep-fixed-delay-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info
